name: Morphe Patch APKs

# 用 Morphe（最新 dev 版）+ Piko NewX + X Shim 修補 YouTube 與 Twitter/X APK。
# 來源 APK 與 Manager 匯出的 selections 放在本倉 release morphe-apk-sources：
#   https://github.com/Capricornus007/morphe-patch/releases/tag/morphe-apk-sources
# 修補完的 APK 以 artifact 上傳（morphe-patched-apks）。
#
# 注意：
# - Morphe 用 --prerelease（最新 dev 版 v2.3.0-dev.x）。用戶的 selections 含
#   dev 版才有的 patch（Autoplay control / Fullscreen playlist panel /
#   Loop count / Playlist button），穩定版 v2.2.0 沒有。
# - YouTube 21.46.522-BETA 只有 dev 版 patch 支援（21.46.520-BETA 時 119/119 全過）。
# - Twitter 12.43.0-beta.01 比 Piko 目標的 12.41.0-prod.01 新，13 個 Piko
#   patch 指紋對不上會失敗（--continue-on-error 讓其餘 47 個照常套用）。
# - YouTube versionName 先由 morphe/fix_youtube_version.py 自動改成純數字
#   （21.46.522-BETA → 21.46.522；腳本自動偵測 X.Y.Z-BETA，換版免改）。
#
# 沿革：自 Capricornus007/repo 拆出（2026-11-15 用戶定案），repo 不再背 morphe。

on:
  workflow_dispatch:
  push:
    paths:
      - 'morphe/**'
      - '.github/workflows/morphe-patch.yml'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 下載 morphe-desktop
        run: curl -fsSL -o morphe-desktop.jar https://github.com/MorpheApp/morphe-desktop/releases/download/v2.1.1/morphe-desktop-2.1.1-all.jar

      - name: 下載來源 APK 與 selections
        run: |
          base=https://github.com/Capricornus007/morphe-patch/releases/download/morphe-apk-sources
          curl -fsSL -o youtube-src.apk "$base/youtube-21.46.522-BETA.apk"
          curl -fsSL -o twitter-src.apkm "$base/twitter-12.43.0-beta.01.apkm"
          curl -fsSL -o export.json "$base/morphe_all_selections.json"
          ls -la youtube-src.apk twitter-src.apkm export.json

      - name: YouTube versionName 改純數字（自動偵測 X.Y.Z-BETA）
        run: python3 morphe/fix_youtube_version.py youtube-src.apk youtube-fixed.apk

      - name: 產生 options 檔（--prerelease = 最新 dev 版）
        run: |
          java -jar morphe-desktop.jar options-create --patches https://github.com/MorpheApp/morphe-patches --prerelease -f com.google.android.youtube -o youtube-options.json
          java -jar morphe-desktop.jar options-create --patches https://github.com/MorpheApp/morphe-patches --patches https://github.com/crimera/piko-newx --patches https://gitlab.com/inotia00/x-shim --prerelease -f com.twitter.android -o twitter-options.json

      - name: 套用 selections
        run: python3 morphe/apply_selections.py export.json youtube-options.json com.google.android.youtube twitter-options.json com.twitter.android

      - name: 修補 YouTube
        run: java -jar morphe-desktop.jar patch --patches https://github.com/MorpheApp/morphe-patches --prerelease --options-file youtube-options.json --force --continue-on-error -o youtube-patched.apk youtube-fixed.apk

      - name: 修補 Twitter/X
        run: java -jar morphe-desktop.jar patch --patches https://github.com/MorpheApp/morphe-patches --prerelease --patches https://github.com/crimera/piko-newx --patches https://gitlab.com/inotia00/x-shim --options-file twitter-options.json --force --continue-on-error -o twitter-patched.apk twitter-src.apkm

      - name: 以用戶 keystore 簽署（與已裝版本同鑰匙，可覆蓋升級）
        env:
          MORPHE_KS_B64: ${{ secrets.MORPHE_KS_B64 }}
          MORPHE_KS_PASS: ${{ secrets.MORPHE_KS_PASS }}
          MORPHE_KS_ALIAS: ${{ secrets.MORPHE_KS_ALIAS }}
        run: |
          echo "$MORPHE_KS_B64" | base64 -d > morphe.p12
          BT=$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/*/ 2>/dev/null | sort -V | tail -1)
          echo "build-tools: $BT"
          export PATH="$BT:$PATH"
          for apk in youtube-patched.apk twitter-patched.apk; do
            zipalign -f 4 "$apk" "${apk%.apk}-aligned.apk"
            apksigner sign --ks morphe.p12 --ks-pass "pass:$MORPHE_KS_PASS" \
              --ks-key-alias "$MORPHE_KS_ALIAS" --key-pass "pass:$MORPHE_KS_PASS" \
              --out "$apk" "${apk%.apk}-aligned.apk"
            apksigner verify --print-certs "$apk" | sed -n '1,2p'
          done

      - name: 上傳修補完的 APK
        uses: actions/upload-artifact@v7
        with:
          name: morphe-patched-apks
          path: |
            youtube-patched.apk
            twitter-patched.apk
          retention-days: 30

      - name: 發布修補成品到 release morphe-patched（與來源素材分開，可直接下載安裝）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view morphe-patched --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create morphe-patched --repo "$GITHUB_REPOSITORY" \
              --title "morphe-patched" \
              --notes "Morphe 修補成品。youtube-patched.apk 的 versionName 已是純數字（去 -BETA），直接安裝這個；release morphe-apk-sources 裡的是未修補素材，不要拿來裝。"
          gh release upload morphe-patched --repo "$GITHUB_REPOSITORY" --clobber \
            youtube-patched.apk twitter-patched.apk
